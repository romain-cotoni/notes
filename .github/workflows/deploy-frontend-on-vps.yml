name: Deploy Angular Application

on:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-on-vps.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clean up old files
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.OVH_VPS_SSH_HOST }}
          username: ${{ secrets.OVH_VPS_SSH_USER }}
          key: ${{ secrets.OVH_VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OVH_VPS_SSH_PORT }}
          script: |
            sudo rm -rf /var/www/html/*

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build --prod

      - name: Copy built files to server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.OVH_VPS_SSH_HOST }}
          username: ${{ secrets.OVH_VPS_SSH_USER }}
          key: ${{ secrets.OVH_VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OVH_VPS_SSH_PORT }}
          source: frontend/dist/angular-notes/browser/*
          strip_components: 1
          target: /var/www/html/

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.OVH_VPS_SSH_HOST }}
          username: ${{ secrets.OVH_VPS_SSH_USER }}
          key: ${{ secrets.OVH_VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OVH_VPS_SSH_PORT }}
          script: |
            sudo systemctl restart nginx
